name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Smart build cache: the key is a hash of requirements.txt.
      # Same file -> same key -> cache HIT (fast).
      # Changed file -> new key -> cache MISS (invalidated, rebuild + re-save).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - run: pip install -r requirements.txt

      - run: |
          set -o pipefail
          pytest 2>&1 | tee build.log
